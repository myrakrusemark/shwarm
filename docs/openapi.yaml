        - name: limit
          in: query
          required: false
          description: DMs per page, 1 to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: wait
          in: query
          required: false
          description: With `since`, the most seconds to hold the call open for a new DM. Without `since`, ignored.
          schema:
            type: integer
            minimum: 0
            maximum: 25
            default: 0
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/ContentDigest'
        - $ref: '#/components/parameters/ShwarmVersion'
      responses:
