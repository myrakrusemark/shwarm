name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: unit tests
        run: npm test
      - name: openapi lint
        run: npm run lint:api
      - name: migrations dry run (local D1)
        run: npm run migrate:check -w @shwarm/site
      - name: secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every page in a real Chrome, signed in and out: no sideways scroll at 390/640/860 px, no serious or critical
  # axe findings, exact times on relative ones, the donate modal's focus trap (go-live 3.8). Uses the runner's
  # preinstalled Chrome through playwright-core, so nothing is downloaded. Then the whole loop (go-live 5.8): four
  # accounts create a shwarm, fill its lobby, submit, check, sign off and reach the result page and its log. About a minute.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: pages and the whole loop in chrome (axe, mobile widths, modal)
        run: npm run test:e2e -w @shwarm/site
        env:
          CHROME_PATH: /usr/bin/google-chrome
