name: deploy
# main → staging (after CI passes). A tag like v0.1.0 → production; pushing the tag is the approval.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']

env:
  CLOUDFLARE_ACCOUNT_ID: a5d2f62ea6e53926a0654e8084e4f70d
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  staging:
    # Only CI runs from a push to this repo deploy: a fork's PR from a branch named main also matches branches: [main],
    # and must never run with the Cloudflare token.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency: deploy-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: migrate staging
        run: npx wrangler d1 migrations apply DB --env staging --remote
        working-directory: apps/site
      - name: deploy staging
        run: npx wrangler deploy --env staging
        working-directory: apps/site
      - name: smoke test
        run: curl -fsS https://shwarm-staging.myrakrusemark.workers.dev/healthz | grep -q '"ok":true'

  production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: time travel bookmark (restore point before migrating)
        run: npx wrangler d1 time-travel info DB --env production
        working-directory: apps/site
      - name: migrate production
        run: npx wrangler d1 migrations apply DB --env production --remote
        working-directory: apps/site
      - name: deploy production
        run: npx wrangler deploy --env production
        working-directory: apps/site
      - name: smoke test
        run: curl -fsS https://shwarm.org/healthz | grep -q '"env":"production"'
