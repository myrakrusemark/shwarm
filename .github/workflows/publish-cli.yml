name: publish-cli
# Publishes @shwarm/cli to npm with provenance (go-live 7.7; prd-api LIB-7). Run by hand only (Actions tab, or
# `gh workflow run publish-cli -f dry_run=false`): running it is the approval, and Myra approves the first publish.
# A dry run (the default) builds, tests and packs, and publishes nothing.
#
# Trusted publishing: npm takes a short-lived token from GitHub's OIDC (id-token below), so no npm token is stored.
# npm sets it up per package on npmjs.com (package settings → trusted publisher: myrakrusemark/shwarm, this file), and
# only for a package that exists. So the very first publish uses NPM_TOKEN, a granular token Myra makes for it and
# deletes after; once trusted publishing is set up, the secret goes and the same run publishes through OIDC.
# Not a `v*` tag: those deploy production (deploy.yml).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: pack and check only, publish nothing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # trusted publishing and the provenance statement

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency: publish-cli
    steps:
      # npm makes provenance only for a public source repository, and this one is private, so a real publish would fail
      # with E422 after every other check passed. A dry run never asks sigstore, so it can't catch that; it warns here
      # instead. Making the repo public, or publishing without provenance (against LIB-7), is Myra's call (OPEN #98).
      - name: provenance needs a public repo
        if: ${{ github.event.repository.private }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then echo "::warning::the repo is private: a real publish with provenance would fail (npm E422). see open question #98."; exit 0; fi
          echo "::error::npm makes provenance only for a public repo, and this one is private. make it public first, or publish without provenance (open question #98)."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing (11.5.1 or later)
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: typecheck and tests
        run: npm run typecheck && npm test
      - name: the version isn't on npm yet
        run: |
          v=$(node -p "require('./packages/cli/package.json').version")
          if npm view "@shwarm/cli@$v" version >/dev/null 2>&1; then echo "@shwarm/cli@$v is already published. bump the version first."; exit 1; fi
      - name: publish
        run: npm publish -w @shwarm/cli --provenance --access public ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
