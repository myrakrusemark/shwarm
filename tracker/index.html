<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/mark.png">
<title>go-live · shwarm</title>
<style>
  :root {
    --paper: #f3eedb;
    --paper-2: #e9e2c6;
    --ink: #13261b;
    --moss: #2f6b3a;
    --leaf: #5c9a3e;
    --sun: #f4c531;
    --clay: #c4572d;
    --sky: #1d4ed8;
    --rule: 1.5px solid var(--ink);
    --rule-heavy: 3px solid var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body {
    font: 14px/1.5 ui-monospace, "JetBrains Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
    background-image: radial-gradient(circle at 1px 1px, rgba(19,38,27,.10) 1px, transparent 0);
    background-size: 14px 14px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 16px 60px; }
  a { color: var(--sky); }
  code { background: var(--paper-2); padding: 0 3px; font-size: .95em; }

  header { border: var(--rule-heavy); background: var(--paper); display: flex; align-items: center; gap: 14px; padding: 12px 16px; }
  header .mark { width: 40px; height: 40px; background: var(--ink); -webkit-mask: url(/mark.png) center/contain no-repeat; mask: url(/mark.png) center/contain no-repeat; flex: 0 0 auto; }
  header h1 { font: 900 30px/1 "Arial Black", Arial, sans-serif; margin: 0; letter-spacing: -1px; }
  header h1 span { color: var(--moss); }
  header .sub { font-size: 12.5px; opacity: .8; }
  header .live { margin-left: auto; font-size: 12px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  header .live i { width: 9px; height: 9px; border-radius: 50%; background: var(--leaf); display: inline-block; }
  header .live.off i { background: var(--clay); }
  .strip { background: var(--ink); color: #fff; padding: 8px 16px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
  .strip b { color: var(--sun); }
  .bar { flex: 1 1 260px; height: 12px; border: 1.5px solid var(--paper); position: relative; min-width: 160px; }
  .bar > i { position: absolute; inset: 0 auto 0 0; background: var(--leaf); }
  .bar > i.doing { background: var(--sun); }

  .now { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 18px 0; }
  .box { border: var(--rule); background: var(--paper); }
  .box h2 { margin: 0; padding: 4px 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; background: var(--moss); color: #fff; display: flex; justify-content: space-between; gap: 8px; }
  .box h2 span { font-weight: 400; text-transform: none; letter-spacing: 0; opacity: .85; }
  .box h2.sunny { background: var(--sun); color: var(--ink); }
  .box .in { padding: 10px 12px; }
  .now .in { font-size: 13.5px; }
  .now ul { margin: 0; padding-left: 18px; }
  .now li { margin: 3px 0; }

  .test { margin: 0 0 18px; }
  .test .in { font-size: 13px; }
  details.test summary { cursor: pointer; padding: 4px 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; background: var(--ink); color: #fff; list-style: none; }
  details.test summary::-webkit-details-marker { display: none; }
  details.test summary::after { content: " ▾"; }

  .grid { display: grid; grid-template-columns: 1fr 330px; gap: 22px; align-items: start; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; font-size: 12.5px; align-items: center; }
  .filters button { font: inherit; border: var(--rule); background: var(--paper); padding: 2px 9px; cursor: pointer; }
  .filters button.on { background: var(--ink); color: #fff; }

  .phase { margin-bottom: 14px; }
  .phase > h3 { margin: 0; cursor: pointer; display: grid; grid-template-columns: 1fr 140px auto; gap: 12px; align-items: center; padding: 6px 10px; background: var(--paper-2); border: var(--rule); font-size: 13.5px; user-select: none; }
  .phase > h3 .t { font-weight: 700; }
  .phase > h3 .t small { font-weight: 400; opacity: .7; margin-left: 6px; }
  .phase > h3 .n { font-size: 12px; white-space: nowrap; }
  .phase .pbar { height: 9px; border: 1.5px solid var(--ink); position: relative; background: var(--paper); }
  .phase .pbar i { position: absolute; inset: 0 auto 0 0; background: var(--leaf); }
  .phase.cur > h3 { background: var(--sun); }
  .phase.complete > h3 { background: rgba(92,154,62,.25); }
  .steps { border: var(--rule); border-top: 0; }
  .step { border-top: 1px dashed rgba(19,38,27,.3); }
  .step:first-child { border-top: 0; }
  .step .row { display: grid; grid-template-columns: 46px 1fr auto auto; gap: 10px; align-items: center; padding: 6px 10px; cursor: pointer; }
  .step .id { font-weight: 700; font-size: 12.5px; }
  .step .ti { font-size: 13.5px; }
  .step .ti .should { font-size: 11px; opacity: .65; }
  .who { font-size: 11px; padding: 0 5px; border: 1px solid var(--ink); white-space: nowrap; }
  .who.myra { background: var(--sun); }
  .who.both { background: linear-gradient(90deg, var(--sun) 50%, var(--paper) 50%); }
  .step select { font: inherit; font-size: 11.5px; border: 1.5px solid var(--ink); padding: 0 2px; background: var(--paper); cursor: pointer; }
  .step.s-doing { background: rgba(244,197,49,.35); }
  .step.s-done .ti { text-decoration: line-through; opacity: .55; }
  .step.s-done select { background: var(--leaf); color: #fff; }
  .step.s-doing select { background: var(--sun); }
  .step.s-blocked select { background: var(--clay); color: #fff; }
  .step.s-blocked { background: rgba(196,87,45,.12); }
  .step.s-parked .ti { opacity: .45; font-style: italic; }
  .step .det { padding: 2px 12px 10px 66px; font-size: 13px; display: none; }
  .step.open .det { display: block; }
  .det p { margin: 4px 0; }
  .det .k { font-weight: 700; }

  .dec .row { padding: 7px 10px; border-top: 1px dashed rgba(19,38,27,.3); font-size: 12.5px; cursor: pointer; }
  .dec .row:first-child { border-top: 0; }
  .dec .row .h { display: flex; gap: 8px; align-items: baseline; }
  .dec .row .h b { flex: 1; }
  .pill { font-size: 10.5px; font-weight: 700; padding: 0 5px; white-space: nowrap; }
  .pill.ok { background: var(--leaf); color: #fff; }
  .pill.wait { background: var(--sun); }
  .dec .row .more { display: none; margin-top: 4px; opacity: .9; }
  .dec .row.open .more { display: block; }
  .dec .row .nb { font-size: 11px; opacity: .7; }
  .pill.rep { background: var(--sky); color: #fff; }
  .brows { margin: 8px 0 0; padding-left: 22px; max-height: 420px; overflow: auto; border: 1px solid rgba(19,38,27,.25); background: #fffdf3; padding-top: 6px; padding-bottom: 6px; }
  .brows li { margin: 0 0 8px; padding-right: 8px; }
  .reply { margin-top: 8px; border-top: 1px dashed rgba(19,38,27,.3); padding-top: 8px; cursor: default; }
  .reply .btns { display: flex; gap: 6px; margin-bottom: 6px; }
  .reply button { font: inherit; font-size: 12px; border: 1.5px solid var(--ink); background: var(--paper); padding: 1px 9px; cursor: pointer; }
  .reply button.on { background: var(--ink); color: #fff; }
  .reply button.save { background: var(--sun); font-weight: 700; margin-left: auto; box-shadow: 2px 2px 0 var(--ink); }
  .reply textarea { width: 100%; font: inherit; font-size: 12.5px; border: 1.5px solid var(--ink); background: #fffdf3; padding: 5px 7px; min-height: 54px; resize: vertical; }
  .said { margin-top: 6px; font-size: 12px; background: rgba(29,78,216,.08); border-left: 3px solid var(--sky); padding: 4px 8px; }
  .said .when { opacity: .6; font-size: 11px; }
  .said .by { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-right: 6px; opacity: .7; }
  .said.claude { background: rgba(47,107,58,.10); border-left-color: var(--moss); }
  .pill.cl { background: var(--moss); color: #fff; }
  aside .box + .box { margin-top: 18px; }
  .park ul { margin: 0; padding: 8px 12px 8px 26px; font-size: 12.5px; }
  .park li { margin: 4px 0; }
  .err { background: var(--clay); color: #fff; padding: 8px 12px; margin: 12px 0; display: none; }
  @media (max-width: 900px) { .grid, .now { grid-template-columns: 1fr; } .phase > h3 { grid-template-columns: 1fr auto; } .phase .pbar { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <i class="mark" aria-hidden="true"></i>
    <div><h1>s<span>h</span>warm go-live</h1><div class="sub">reads <code>docs/go-live.md</code> live · change a status here or in the doc</div></div>
    <span class="live" id="live"><i></i><span>watching the plan</span></span>
  </header>
  <div class="strip"><span id="count"></span><div class="bar" id="bar"></div><span id="updated"></span></div>
  <div class="err" id="err"></div>

  <div class="now">
    <div class="box"><h2>now · claude</h2><div class="in" id="nowC"></div></div>
    <div class="box"><h2 class="sunny">now · myra</h2><div class="in" id="nowM"></div></div>
  </div>

  <details class="test box"><summary>the launch done test</summary><div class="in" id="test"></div></details>

  <div class="grid">
    <main>
      <div class="filters" id="filters">
        show:
        <button data-f="all">all</button><button data-f="open">not done</button><button data-f="myra">myra's</button><button data-f="claude">claude's</button>
      </div>
      <div id="phases"></div>
    </main>
    <aside>
      <div class="box dec"><h2>decisions to lock <span id="decN"></span></h2><div class="in" style="font-size:12px;padding:6px 10px;border-bottom:1px dashed rgba(19,38,27,.3)">open one, answer yes / change / question, save. claude reads <code>tracker/replies.json</code> and records it.</div><div id="dec"></div></div>
      <div class="box park"><h2>parking lot <span id="parkN"></span></h2><ul id="park"></ul></div>
    </aside>
  </div>
</div>

<script type="module">
const $ = id => document.getElementById(id)
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} },
}
let filter = store.get('gl.filter', 'all')
const openSteps = new Set(store.get('gl.steps', []))
const openPhases = new Set(store.get('gl.phases', []))
const closedPhases = new Set(store.get('gl.closed', []))
let lastText = ''
let replies = {}
const openDecs = new Set(store.get('gl.decs', []))
const drafts = {}

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
function md(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\*([^*]+)\*/g, '<i>$1</i>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => /^https?:/.test(u) ? `<a href="${u}" target="_blank">${t}</a>` : `<u title="${u}">${t}</u>`)
}
const section = (src, title) => {
  const i = src.search(new RegExp('^## ' + title, 'm'))
  if (i < 0) return ''
  const rest = src.slice(i)
  const j = rest.slice(3).search(/^## /m)
  return j < 0 ? rest : rest.slice(0, j + 3)
}

function parse(src) {
  const line = re => (src.match(re) || [, ''])[1].trim()
  const plan = {
    nowC: line(/^\*\*Now \(Claude\):\*\*(.*)$/m),
    nowM: line(/^\*\*Now \(Myra\):\*\*(.*)$/m),
    updated: line(/^\*\*Last updated:\*\*(.*)$/m),
    test: section(src, '1\\. ').split('\n').slice(1).join('\n').replace(/^---\s*$/m, '').trim(),
    decisions: [], phases: [], parking: [],
  }
  // table A
  const decSec = (src.split('### Table A')[1] || '').split('### Table B')[0]
  for (const l of decSec.split('\n')) {
    const c = l.split('|').map(x => x.trim())
    if (c.length < 6 || !/^A\d+/.test(c[1])) continue
    plan.decisions.push({ id: c[1], name: c[2].replace(/\*\*/g, ''), rec: c[3], q: c[4], by: c[5], decided: /^decided/i.test(c[3]) })
  }
  const bSec = (src.split('### Table B')[1] || '').split(/^---/m)[0]
  const bRows = bSec.split('\n').map(l => l.split('|').map(x => x.trim())).filter(c => c.length >= 4 && c[1] && c[1] !== 'question' && !/^-+$/.test(c[1]))
  plan.decisions.push({ id: 'B', name: `Table B: ${bRows.length} smaller defaults`, rec: 'Each is a setting or small piece of code, cheap to change later. Answer yes to accept all, or change and name the rows.', rows: bRows.map(c => ({ q: c[1], d: c[2] })), q: '', by: '0.1', decided: /^\*\*Table B accepted/m.test(src) })
  // phases and steps
  const parts = src.split(/^### Phase /m).slice(1)
  for (const p of parts) {
    const head = p.split('\n')[0]
    const m = head.match(/^(\d+): (.+?)(?: \((.+)\))?$/)
    if (!m) continue
    const body = p.split(/^## /m)[0]
    const steps = []
    const re = /^\*\*(\d+\.\d+[ab]?) (.+?)\*\*(?: · (todo|doing|done|blocked|parked))?[ \t]*$/gm
    let s
    const heads = []
    while ((s = re.exec(body))) heads.push({ id: s[1], title: s[2], status: s[3] || 'todo', at: s.index, end: re.lastIndex })
    heads.forEach((h, i) => {
      const chunk = body.slice(h.end, i + 1 < heads.length ? heads[i + 1].at : body.length)
      const field = k => { const mm = chunk.match(new RegExp('\\*\\*' + k + ':\\*\\*\\s*(.*?)(?= · \\*\\*|$)', 'm')); return mm ? mm[1].trim() : '' }
      const who = field('who')
      const lane = /^myra/i.test(who) ? 'myra' : /^claude/i.test(who) ? 'claude' : /^both/i.test(who) ? 'both' : (/myra/i.test(who) ? 'myra' : 'claude')
      steps.push({ ...h, should: /\(should\)/i.test(h.title), what: field('what'), who, lane, needs: field('needs'), due: field('due before'), done: field('done when') })
    })
    plan.phases.push({ n: m[1], name: m[2], size: m[3] || '', steps })
  }
  // parking lot
  const park = section(src, '8\\. Parking lot')
  plan.parking = park.split('\n').filter(l => l.startsWith('- ')).map(l => l.slice(2))
  return plan
}

function render(plan) {
  const all = plan.phases.flatMap(p => p.steps)
  const counted = all.filter(s => s.status !== 'parked')
  const done = counted.filter(s => s.status === 'done').length
  const doing = counted.filter(s => s.status === 'doing').length
  $('count').innerHTML = `<b>${done}</b> of ${counted.length} steps done · ${doing} doing · ${counted.filter(s => s.status === 'blocked').length} blocked`
  $('bar').innerHTML = `<i style="width:${(done / counted.length) * 100}%"></i><i class="doing" style="left:${(done / counted.length) * 100}%;width:${(doing / counted.length) * 100}%"></i>`
  $('updated').textContent = 'plan updated ' + plan.updated
  $('nowC').innerHTML = md(plan.nowC)
  $('nowM').innerHTML = '<ul>' + plan.nowM.split(' · ').map(x => `<li>${md(x)}</li>`).join('') + '</ul>'
  $('test').innerHTML = plan.test.split(/\n\n+/).map(p => /^\d+\./.test(p) ? '<ol>' + p.split(/\n(?=\d+\.)/).map(x => `<li>${md(x.replace(/^\d+\.\s*/, ''))}</li>`).join('') + '</ol>' : `<p>${md(p)}</p>`).join('')

  // which phase is current: first with a doing step, else first not complete
  const cur = (plan.phases.find(p => p.steps.some(s => s.status === 'doing')) || plan.phases.find(p => p.steps.some(s => !['done', 'parked'].includes(s.status))) || {}).n
  const show = s => filter === 'all' || (filter === 'open' && !['done', 'parked'].includes(s.status)) || (filter === 'myra' && s.lane !== 'claude') || (filter === 'claude' && s.lane !== 'myra')
  $('phases').innerHTML = plan.phases.map(p => {
    const c = p.steps.filter(s => s.status !== 'parked')
    const d = c.filter(s => s.status === 'done').length
    const complete = c.length && d === c.length
    const isOpen = openPhases.has(p.n) || (p.n === cur && !closedPhases.has(p.n))
    const vis = p.steps.filter(show)
    return `<section class="phase ${p.n === cur ? 'cur' : ''} ${complete ? 'complete' : ''}" data-p="${p.n}">
      <h3><span class="t">${p.n}. ${esc(p.name)}<small>${esc(p.size)}</small></span><span class="pbar"><i style="width:${c.length ? (d / c.length) * 100 : 0}%"></i></span><span class="n">${d}/${c.length}</span></h3>
      ${isOpen ? `<div class="steps">${vis.map(s => `
        <div class="step s-${s.status} ${openSteps.has(s.id) ? 'open' : ''}" data-id="${s.id}">
          <div class="row"><span class="id">${s.id}</span><span class="ti">${md(s.title.replace(/\s*\(should\)/i, ''))}${s.should ? ' <span class="should">(should)</span>' : ''}</span>
            <span class="who ${s.lane}">${s.lane}</span>
            <select aria-label="status of ${s.id}">${['todo', 'doing', 'done', 'blocked', 'parked'].map(o => `<option ${o === s.status ? 'selected' : ''}>${o}</option>`).join('')}</select></div>
          <div class="det">
            ${s.what ? `<p><span class="k">what:</span> ${md(s.what)}</p>` : ''}
            ${s.who ? `<p><span class="k">who:</span> ${md(s.who)}${s.needs ? ` · <span class="k">needs:</span> ${md(s.needs)}` : ''}${s.due ? ` · <span class="k">due before:</span> ${md(s.due)}` : ''}</p>` : ''}
            ${s.done ? `<p><span class="k">done when:</span> ${md(s.done)}</p>` : ''}
          </div>
        </div>`).join('') || '<div class="step"><div class="row"><span></span><span class="ti" style="opacity:.6">nothing here for this filter</span></div></div>'}</div>` : ''}
    </section>`
  }).join('')

  const waiting = plan.decisions.filter(d => !d.decided).length
  const lastOf = id => (replies[id] || []).slice(-1)[0]
  const replied = plan.decisions.filter(d => !d.decided && lastOf(d.id)).length
  $('decN').textContent = `${plan.decisions.length - waiting} decided · ${replied} in talk · ${waiting - replied} waiting`
  $('dec').innerHTML = plan.decisions.map(d => {
    const rs = replies[d.id] || []
    const last = rs[rs.length - 1]
    const fromClaude = last && last.from === 'claude'
    const pill = d.decided ? '<span class="pill ok">decided</span>' : !last ? '<span class="pill wait">waiting</span>' : fromClaude ? '<span class="pill cl">claude answered</span>' : '<span class="pill rep">replied</span>'
    const dr = drafts[d.id] || { choice: '', text: '' }
    return `<div class="row ${openDecs.has(d.id) ? 'open' : ''}" data-d="${d.id}"><div class="h"><span>${d.id}</span><b>${esc(d.name)}</b>${pill}</div>
    <div class="nb">needed by ${md(d.by)}</div>
    ${rs.map((m, i) => `<div class="said ${m.from === 'claude' ? 'claude' : ''}"><span class="by">${m.from === 'claude' ? 'claude' : 'myra'}</span>${m.from === 'claude' ? '' : `<b>${m.choice}</b>${m.text ? ': ' : ''}`}${md(m.text || '')} <span class="when">· ${new Date(m.at).toLocaleString()}${i === rs.length - 1 && !d.decided && m.from !== 'claude' ? ' · claude is on it' : ''}</span></div>`).join('')}
    <div class="more">${md(d.rec)}${d.rows ? `<ol class="brows">${d.rows.map(r => `<li><b>${md(r.q)}</b><br>${md(r.d)}</li>`).join('')}</ol>` : ''}
      ${d.decided ? '' : `<div class="reply" data-r="${d.id}">
        <div class="btns"><button data-c="yes" class="${dr.choice === 'yes' ? 'on' : ''}">yes</button><button data-c="change" class="${dr.choice === 'change' ? 'on' : ''}">change</button><button data-c="question" class="${dr.choice === 'question' ? 'on' : ''}">question</button><button class="save">save</button></div>
        <textarea placeholder="anything to add or change (optional for yes)">${esc(dr.text)}</textarea>
      </div>`}</div></div>`
  }).join('')
  $('parkN').textContent = plan.parking.length
  $('park').innerHTML = plan.parking.map(x => `<li>${md(x)}</li>`).join('')
  document.querySelectorAll('#filters button').forEach(b => b.classList.toggle('on', b.dataset.f === filter))
}

async function load() {
  try {
    const r = await fetch('/plan.md', { cache: 'no-store' })
    const rr = await fetch('/api/replies', { cache: 'no-store' })
    const t = (await r.text()) + '\u0000' + (await rr.text())
    $('live').classList.remove('off')
    if (t === lastText) return
    if (document.activeElement && document.activeElement.closest('.reply')) return
    lastText = t
    replies = JSON.parse(t.split('\u0000')[1] || '{}')
    render(parse(t.split('\u0000')[0]))
    $('err').style.display = 'none'
  } catch (e) {
    $('live').classList.add('off')
    $('live').lastChild.textContent = 'not connected'
  }
}

document.addEventListener('click', e => {
  if (e.target.closest('select')) return
  const fb = e.target.closest('#filters button')
  if (fb) { filter = fb.dataset.f; store.set('gl.filter', filter); lastText = ''; return load() }
  const ph = e.target.closest('.phase > h3')
  if (ph) {
    const n = ph.parentElement.dataset.p
    const isOpen = !!ph.parentElement.querySelector('.steps')
    if (isOpen) { openPhases.delete(n); closedPhases.add(n) } else { openPhases.add(n); closedPhases.delete(n) }
    store.set('gl.phases', [...openPhases]); store.set('gl.closed', [...closedPhases]); lastText = ''; return load()
  }
  const st = e.target.closest('.step .row')
  if (st) {
    const el = st.parentElement, id = el.dataset.id
    el.classList.toggle('open')
    el.classList.contains('open') ? openSteps.add(id) : openSteps.delete(id)
    return store.set('gl.steps', [...openSteps])
  }
  const rb = e.target.closest('.reply button')
  if (rb) {
    const box = rb.closest('.reply'), id = box.dataset.r
    const d = (drafts[id] ||= { choice: '', text: '' })
    d.text = box.querySelector('textarea').value
    if (!rb.classList.contains('save')) { d.choice = rb.dataset.c; box.querySelectorAll('button[data-c]').forEach(b => b.classList.toggle('on', b === rb)); return }
    if (!d.choice) d.choice = d.text ? 'change' : 'yes'
    fetch('/api/replies', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, choice: d.choice, text: d.text }) })
      .then(async r => { if (!r.ok) throw new Error(await r.text()); delete drafts[id]; document.activeElement.blur(); lastText = ''; load() })
      .catch(err => { $('err').textContent = `couldn't save ${id}: ${err.message}`; $('err').style.display = 'block' })
    return
  }
  if (e.target.closest('.reply')) return
  const dr = e.target.closest('.dec .row')
  if (dr && !e.target.closest('a')) {
    dr.classList.toggle('open')
    dr.classList.contains('open') ? openDecs.add(dr.dataset.d) : openDecs.delete(dr.dataset.d)
    store.set('gl.decs', [...openDecs])
  }
})
document.addEventListener('input', e => {
  const ta = e.target.closest('.reply textarea')
  if (ta) (drafts[ta.closest('.reply').dataset.r] ||= { choice: '', text: '' }).text = ta.value
})
document.addEventListener('change', async e => {
  const sel = e.target.closest('.step select')
  if (!sel) return
  const id = sel.closest('.step').dataset.id
  const r = await fetch('/api/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, status: sel.value }) })
  if (!r.ok) { $('err').textContent = `couldn't save ${id}: ${await r.text()}`; $('err').style.display = 'block' }
  load()
})

if (import.meta.hot) import.meta.hot.on('plan-changed', load)
setInterval(load, 5000)
load()
</script>
</body>
</html>
