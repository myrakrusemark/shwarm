<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/mark.png">
<title>go-live · shwarm</title>
<style>
  :root {
    --paper: #f3eedb;
    --paper-2: #e9e2c6;
    --ink: #13261b;
    --moss: #2f6b3a;
    --leaf: #5c9a3e;
    --sun: #f4c531;
    --clay: #c4572d;
    --sky: #1d4ed8;
    --rule: 1.5px solid var(--ink);
    --rule-heavy: 3px solid var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body {
    font: 14px/1.55 ui-monospace, "JetBrains Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
    background-image: radial-gradient(circle at 1px 1px, rgba(19,38,27,.10) 1px, transparent 0);
    background-size: 14px 14px;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 22px 16px 60px; }
  a { color: var(--sky); overflow-wrap: anywhere; }
  code { background: var(--paper-2); padding: 0 3px; font-size: .95em; }

  header { border: var(--rule-heavy); background: var(--paper); display: flex; align-items: center; gap: 14px; padding: 12px 16px; flex-wrap: wrap; }
  header .mark { width: 40px; height: 40px; background: var(--ink); -webkit-mask: url(/mark.png) center/contain no-repeat; mask: url(/mark.png) center/contain no-repeat; flex: 0 0 auto; }
  header h1 { font: 900 28px/1 "Arial Black", Arial, sans-serif; margin: 0; letter-spacing: -1px; }
  header h1 span { color: var(--moss); }
  header .sub { font-size: 12.5px; opacity: .8; }
  #live { margin-left: auto; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  #live::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--leaf); }
  #live.off::before { background: var(--clay); }

  .progress { background: var(--ink); color: #fff; padding: 10px 16px 12px; }
  .progress .line { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; }
  .progress b { color: var(--sun); }
  .bar { height: 14px; border: 1.5px solid var(--paper); position: relative; margin-top: 8px; }
  .bar i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--leaf); }
  .bar i.doing { background: var(--sun); }
  .phases { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 14px; margin-top: 10px; font-size: 11.5px; }
  .phases div { display: flex; gap: 6px; align-items: center; opacity: .9; }
  .phases span.t { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .phases span.p { flex: 0 0 46px; height: 6px; border: 1px solid var(--paper); position: relative; }
  .phases span.p i { position: absolute; inset: 0 auto 0 0; background: var(--leaf); }

  h2 { font: 900 22px/1.1 "Arial Black", Arial, sans-serif; letter-spacing: -.5px; margin: 26px 0 10px; display: flex; gap: 10px; align-items: baseline; }
  h2 small { font: 13px ui-monospace, monospace; opacity: .7; letter-spacing: 0; }
  .none { border: var(--rule); background: var(--paper); padding: 14px; box-shadow: 4px 4px 0 var(--leaf); }

  .item { border: var(--rule); background: var(--paper); box-shadow: 4px 4px 0 var(--ink); margin-bottom: 16px; }
  .item.replied { box-shadow: 4px 4px 0 var(--leaf); }
  .item > .head { display: flex; gap: 10px; align-items: baseline; padding: 10px 12px; cursor: pointer; }
  .item > .head .txt { flex: 1 1 auto; }
  .item > .head .pill { flex: 0 0 auto; }
  .pill { font-size: 11px; border: 1px solid var(--ink); padding: 0 6px; white-space: nowrap; }
  .pill.wait { background: var(--sun); }
  .pill.cl { background: var(--sun); }
  .pill.ok { background: var(--leaf); color: #fff; border-color: var(--leaf); }
  .item .body { display: none; border-top: var(--rule); padding: 10px 12px; }
  .item.open .body { display: block; }
  .said { font-size: 12.5px; margin: 0 0 8px; padding: 6px 8px; background: #fffdf3; border-left: 3px solid var(--ink); }
  .said.claude { border-left-color: var(--moss); background: var(--paper-2); }
  .said .by { font-weight: 700; margin-right: 6px; }
  .said .when { opacity: .6; font-size: 11px; }
  .reply .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .reply button { font: inherit; border: var(--rule); background: var(--paper); padding: 2px 10px; cursor: pointer; }
  .reply button.on { background: var(--ink); color: #fff; }
  .reply button.save { margin-left: auto; background: var(--moss); color: #fff; border-color: var(--moss); }
  .reply textarea { width: 100%; min-height: 60px; font: inherit; border: var(--rule); background: #fffdf3; padding: 6px 8px; }

  .card { border-top: 1px dashed rgba(19,38,27,.35); padding: 10px 0 4px; }
  .card:first-child { border-top: 0; padding-top: 0; }
  .card h3 { margin: 0 0 4px; font: 800 16px/1.25 Arial, sans-serif; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .card h3 .m { font: 11.5px ui-monospace, monospace; opacity: .7; }
  .card p { margin: 4px 0; font-size: 13px; }
  .card .k { font-weight: 700; }
  #err { display: none; background: var(--clay); color: #fff; padding: 8px 12px; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark" aria-hidden="true"></div>
    <div><h1>s<span>h</span>warm go-live</h1><div class="sub" id="updated"></div></div>
    <div id="live"><span>live</span></div>
  </header>
  <div class="progress">
    <div class="line"><span id="count"></span><span id="steps"></span></div>
    <div class="bar" id="bar"></div>
    <div class="phases" id="phases"></div>
  </div>
  <div id="err"></div>

  <h2>needs you <small id="needN"></small></h2>
  <div id="needs"></div>
</div>

<script type="module">
const $ = id => document.getElementById(id)
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
function md(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\*([^*]+)\*/g, '<i>$1</i>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => /^https?:/.test(u) ? `<a href="${u}" target="_blank">${t}</a>` : `<u title="${u}">${t}</u>`)
    .replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g, '$1<a href="$2" target="_blank">$2</a>')
}
const open = new Set()
const drafts = {}
let lastText = ''
let data = {}

function parsePlan(src) {
  const updated = (src.match(/^\*\*Last updated:\*\*(.*)$/m) || [, ''])[1].trim()
  // Myra's list: "- [m-id] text" lines under "### Needs Myra"
  const sec = (src.split(/^### Needs Myra[^\n]*\n/m)[1] || '').split(/^#{2,3} /m)[0]
  const needs = [...sec.matchAll(/^- \[(m-[a-z0-9-]+)\] (.+)$/gm)].map(m => ({ id: m[1], text: m[2].trim() }))
  const phases = []
  for (const p of src.split(/^### Phase /m).slice(1)) {
    const m = p.split('\n')[0].match(/^(\d+): (.+?)(?: \((.+)\))?$/)
    if (!m) continue
    const body = p.split(/^## /m)[0]
    const st = [...body.matchAll(/^\*\*(\d+\.\d+[ab]?) (.+?)\*\*(?: · (todo|doing|done|blocked|parked))?[ \t]*$/gm)].map(s => s[3] || 'todo')
    phases.push({ n: m[1], name: m[2], st })
  }
  return { updated, needs, phases }
}

// Launch cards that wait on Myra: never reviewed; Claude has the last word (answered her, or asked her to approve a
// changed card again); or the done test changed after her approval (the approval carries a fingerprint of the locked
// fields, as apps/site/src/seed/approved.ts counts them). Dropped cards are left out.
const LOCKED = ['slug', 'done_when', 'checked_by', 'builds_on']
const lockedOf = s => JSON.stringify(LOCKED.map(k => s[k] ?? null))
function cardsWaiting(cards, proof, drops) {
  const dropped = new Set([...drops.matchAll(/^- ([a-z0-9-]+)/gm)].map(m => m[1]))
  return cards.filter(s => {
    if (dropped.has(s.slug)) return false
    const t = proof[s.slug] || []
    if (!t.length) return true
    const last = t[t.length - 1]
    if (last.from === 'claude') return true
    return last.choice === 'approve' && last.locked != null && last.locked !== lockedOf(s)
  }).sort((a, b) => String(a.wave).localeCompare(String(b.wave)))
}

function thread(msgs) {
  return msgs.map(m => `<div class="said ${m.from === 'claude' ? 'claude' : ''}"><span class="by">${m.from === 'claude' ? 'claude' : 'myra · ' + esc(m.choice)}</span>${md(m.text || '')} <span class="when">· ${new Date(m.at).toLocaleString()}</span></div>`).join('')
}
function replyBox(key, choices) {
  const d = drafts[key] || { choice: '', text: '' }
  return `<div class="reply" data-key="${esc(key)}"><div class="btns">${choices.map(([c, l]) => `<button data-c="${c}" class="${d.choice === c ? 'on' : ''}">${l}</button>`).join('')}<button class="save">save</button></div>
    <textarea placeholder="anything to add (optional for yes)">${esc(d.text)}</textarea></div>`
}

function render() {
  const { plan, replies, cards, proof, drops } = data
  $('updated').textContent = 'plan updated ' + plan.updated
  const all = plan.phases.flatMap(p => p.st).filter(s => s !== 'parked')
  const done = all.filter(s => s === 'done').length, doing = all.filter(s => s === 'doing').length
  $('count').innerHTML = `<b>${done}</b> of ${all.length} steps done · ${doing} doing`
  $('steps').textContent = `${Math.round((done / all.length) * 100)}%`
  $('bar').innerHTML = `<i style="width:${(done / all.length) * 100}%"></i><i class="doing" style="left:${(done / all.length) * 100}%;width:${(doing / all.length) * 100}%"></i>`
  $('phases').innerHTML = plan.phases.map(p => {
    const c = p.st.filter(s => s !== 'parked'), d = c.filter(s => s === 'done').length
    return `<div title="${esc(p.name)}: ${d} of ${c.length} done"><span class="t">${p.n}. ${esc(p.name)}</span><span class="p"><i style="width:${c.length ? (d / c.length) * 100 : 0}%"></i></span></div>`
  }).join('')

  const items = plan.needs.map(n => {
    const rs = replies[n.id] || []
    const last = rs.at(-1)
    const pill = !last ? '<span class="pill wait">waiting on you</span>' : last.from === 'claude' ? '<span class="pill cl">claude answered</span>' : '<span class="pill ok">you answered · claude is on it</span>'
    return `<div class="item ${last && last.from !== 'claude' ? 'replied' : ''} ${open.has(n.id) ? 'open' : ''}" data-id="${n.id}">
      <div class="head"><span class="txt">${md(n.text)}</span>${pill}</div>
      <div class="body">${thread(rs)}${replyBox('r:' + n.id, [['yes', 'yes / done'], ['change', 'change'], ['question', 'question']])}</div></div>`
  })
  const waiting = cardsWaiting(cards, proof, drops)
  if (waiting.length) items.push(`<div class="item ${open.has('cards') ? 'open' : ''}" data-id="cards">
    <div class="head"><span class="txt"><b>${waiting.length} shwarm card${waiting.length === 1 ? '' : 's'} to approve</b> (new, rewritten, or claude answered your question)</span><span class="pill wait">waiting on you</span></div>
    <div class="body">${waiting.map(s => `<div class="card"><h3>${esc(s.title)} <span class="m">${s.wave === 'idea' ? 'idea' : 'wave ' + esc(s.wave)} · ${esc(s.size || '')}</span></h3>
      <p>${md(s.what)}</p>${s.why_now ? `<p><span class="k">why now:</span> ${md(s.why_now)}</p>` : ''}<p><span class="k">done when:</span> ${md(s.done_when)}</p>
      ${s.needs_humans ? `<p><span class="k">the crowd:</span> ${md(s.needs_humans)}</p>` : ''}
      ${thread(proof[s.slug] || [])}${replyBox('p:' + s.slug, [['approve', 'approve the card'], ['change', 'change'], ['question', 'question']])}</div>`).join('')}</div></div>`)
  $('needN').textContent = items.length ? items.length + (items.length === 1 ? ' thing' : ' things') : ''
  $('needs').innerHTML = items.join('') || '<div class="none">nothing needs you right now.</div>'
}

async function load() {
  try {
    const rs = await Promise.all(['/plan.md', '/api/replies', '/launch.json', '/ideas.json', '/api/proof', '/drops.md'].map(u => fetch(u, { cache: 'no-store' })))
    const texts = await Promise.all(rs.map(r => r.text()))
    $('live').classList.remove('off'); $('live').lastChild.textContent = 'live'
    const t = texts.join('\u0000')
    if (t === lastText) return
    if (document.activeElement && document.activeElement.closest('.reply')) return
    lastText = t
    data = { plan: parsePlan(texts[0]), replies: JSON.parse(texts[1] || '{}'), cards: [...JSON.parse(texts[2]), ...JSON.parse(texts[3] || '[]')], proof: JSON.parse(texts[4] || '{}'), drops: texts[5] }
    render()
  } catch (e) {
    $('live').classList.add('off'); $('live').lastChild.textContent = 'not connected'
  }
}

document.addEventListener('click', e => {
  const b = e.target.closest('.reply button')
  if (b) {
    const box = b.closest('.reply'), key = box.dataset.key
    const d = (drafts[key] ||= { choice: '', text: '' })
    d.text = box.querySelector('textarea').value
    if (!b.classList.contains('save')) { d.choice = b.dataset.c; box.querySelectorAll('button[data-c]').forEach(x => x.classList.toggle('on', x === b)); return }
    if (!d.choice) d.choice = d.text ? 'change' : key.startsWith('p:') ? 'approve' : 'yes'
    const [url, body] = key.startsWith('p:')
      ? ['/api/proof', { slug: key.slice(2), choice: d.choice, text: d.text, locked: d.choice === 'approve' ? lockedOf(data.cards.find(c => c.slug === key.slice(2)) || {}) : undefined }]
      : ['/api/replies', { id: key.slice(2), choice: d.choice, text: d.text }]
    fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(async r => { if (!r.ok) throw new Error(await r.text()); delete drafts[key]; document.activeElement.blur(); lastText = ''; load() })
      .catch(err => { $('err').textContent = `couldn't save: ${err.message}`; $('err').style.display = 'block' })
    return
  }
  if (e.target.closest('.reply, a')) return
  const h = e.target.closest('.item > .head')
  if (h) { const it = h.parentElement; it.classList.toggle('open'); it.classList.contains('open') ? open.add(it.dataset.id) : open.delete(it.dataset.id) }
})
document.addEventListener('input', e => {
  const ta = e.target.closest('.reply textarea')
  if (ta) (drafts[ta.closest('.reply').dataset.key] ||= { choice: '', text: '' }).text = ta.value
})

if (import.meta.hot) import.meta.hot.on('plan-changed', load)
setInterval(load, 5000)
load()
</script>
</body>
</html>
